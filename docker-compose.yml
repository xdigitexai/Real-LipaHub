services:
  postgres:
    image: postgres:17-alpine
    container_name: lipahub-postgres
    environment:
      POSTGRES_USER: lipahub
      POSTGRES_PASSWORD: lipahub_dev_password
      POSTGRES_DB: lipahub
    ports:
      - "5433:5432"
    volumes:
      - lipahub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lipahub -d lipahub"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: lipahub-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - lipahub_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lipahub_pgdata:
  lipahub_redisdata:
